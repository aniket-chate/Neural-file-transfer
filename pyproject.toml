[project]
name = "neural-file-transfer"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "Flask>=3.0.0",
  "Flask-Bootstrap",
  "Flask-WTF",
  "WTForms",
  "Werkzeug",
  "Pillow",
  "torch",
  "torchvision",
]

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchvision = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.vercel]
entrypoint = "utils.app:app"
